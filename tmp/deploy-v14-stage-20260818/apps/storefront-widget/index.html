<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyledGenie Chatbot</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23b450ff%22/><circle cx=%2211%22 cy=%2216%22 r=%225%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/><circle cx=%2221%22 cy=%2216%22 r=%225%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22/></svg>" />
    <link rel="stylesheet" href="./styles.css?v=20260818-semantic-flatlay-collage" />
  </head>
  <body>
    <main class="chat-demo-shell">
      <section class="chat-stage" aria-label="Storefront chat preview">
        <section class="widget-panel">
          <header class="widget-header">
            <div class="widget-status-bar" aria-hidden="true">
              <span class="widget-status-time">9:41</span>
              <span class="widget-status-icons">
                <i class="status-signal">▮▮▮</i>
                <i class="status-wifi">⌁</i>
                <i class="status-battery"><b></b></i>
              </span>
            </div>
            <button
              id="widgetNavButton"
              class="widget-nav-button"
              type="button"
              aria-label="Close chat"
              title="Close chat"
            >
              <svg class="nav-icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M6 6L18 18M18 6L6 18"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="2"
                />
              </svg>
              <svg class="nav-icon-back hidden" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M14.5 6.5L9 12L14.5 17.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                />
              </svg>
            </button>

            <div class="widget-header-titles">
              <h1 class="widget-title" id="widgetWelcomeTitle">Welcome!</h1>
              <p class="widget-subtitle hidden" id="widgetFeatureSubtitle"></p>
            </div>

            <div class="widget-header-actions">
              <button
                id="widgetSkipButton"
                class="widget-skip-button hidden"
                type="button"
              >
                Skip for now
              </button>

              <button
                id="widgetCartButton"
                class="widget-nav-button widget-cart-button"
                type="button"
                aria-label="View cart"
                title="View cart"
              >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M6 7h15l-1.5 9H7.5L6 7z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
                <path d="M6 7L5 4H2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
                <circle cx="9" cy="20" r="1" fill="currentColor" />
                <circle cx="17" cy="20" r="1" fill="currentColor" />
              </svg>
              <span id="cartBadge" class="cart-badge">2</span>
            </button>
            </div>
          </header>

          <section id="widgetCartScreen" class="widget-cart-screen hidden" aria-label="Shopping cart">
            <header class="widget-cart-screen-header">
              <button id="widgetCartCloseButton" class="widget-cart-close-button" type="button" aria-label="Close cart">&#8249;</button>
              <h2>Your cart</h2>
              <span id="widgetCartCount" class="widget-cart-count" aria-live="polite"></span>
            </header>
            <div id="widgetCartBody" class="widget-cart-body"></div>
          </section>

          <section id="authScreen" class="auth-screen hidden" aria-label="Customer login">
            <div id="authBody" class="auth-body"></div>
          </section>

          <section id="onboardingScreen" class="onboarding-screen hidden" aria-label="Profile onboarding">
            <div id="onboardingBody" class="onboarding-body"></div>
            <footer id="onboardingFooter" class="onboarding-footer hidden">
              <button id="onboardingPrimaryBtn" type="button" class="onboarding-primary-btn">Next</button>
            </footer>
          </section>

          <section id="onboardingLoading" class="onboarding-loading-screen hidden" aria-label="Analyzing profile">
            <div class="onboarding-spinner" aria-hidden="true"></div>
          </section>

          <div class="chat-log-shell">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
          </div>

          <section id="swapScreen" class="swap-screen hidden" aria-label="Swap outfit items">
            <p id="swapScreenHint" class="swap-screen-hint">Tap an item to swap it — the rest of the look stays fixed.</p>
            <div id="swapComposition" class="swap-composition"></div>
            <div id="swapItemGrid" class="swap-item-grid"></div>
            <div class="swap-screen-footer">
              <button id="swapAddToCartButton" class="swap-add-cart-button" type="button">Add to cart</button>
            </div>
          </section>

          <div class="composer-shell">
            <input id="imageInput" type="file" accept="image/*" hidden />
            <input id="imageUrlInput" type="hidden" />

            <form id="chatForm" class="chat-form home-mode">
              <button
                id="composerPlusButton"
                class="composer-plus-button"
                type="button"
                aria-haspopup="true"
                aria-expanded="false"
                aria-label="Open image actions"
                title="Add image"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 5V19" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                  <path d="M5 12H19" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                </svg>
              </button>
              <div id="composerQuickActions" class="composer-quick-actions hidden">
                <button type="button" data-action="camera">Take photo</button>
                <button type="button" data-action="upload">Upload photo</button>
              </div>
              <input
                id="chatInput"
                type="text"
                placeholder="Type something....."
              />
              <div class="composer-toolbar">
                <div class="composer-badges hidden" aria-hidden="true">
                  <span id="composerModeBadge" class="composer-badge"></span>
                  <span id="composerSignalBadge" class="composer-badge composer-badge-muted"></span>
                </div>
                <button
                  id="voiceButton"
                  class="composer-voice-button"
                  type="button"
                  aria-label="Start voice input"
                  title="Start voice input"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M12 4.75C10.2051 4.75 8.75 6.20507 8.75 8V11C8.75 12.7949 10.2051 14.25 12 14.25C13.7949 14.25 15.25 12.7949 15.25 11V8C15.25 6.20507 13.7949 4.75 12 4.75Z"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                    />
                    <path
                      d="M6.75 10.75V11C6.75 13.8995 9.10051 16.25 12 16.25C14.8995 16.25 17.25 13.8995 17.25 11V10.75"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-width="1.8"
                    />
                    <path d="M12 16.25V19.25" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
                  </svg>
                </button>
                <button
                  class="composer-send-button"
                  type="submit"
                  aria-label="Send message"
                  title="Send message"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M4 11.5L20 4L13 20L10.8 13.8L4 11.5Z"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                    />
                  </svg>
                </button>
              </div>
            </form>
            <p id="guidedHelperText" class="guided-helper-text hidden"></p>
          </div>

          <div id="cameraCard" class="camera-screen hidden" aria-live="polite">
            <div class="camera-screen-body">
              <div class="camera-screen-copy">
                <strong id="cameraTitle">Scan your piece</strong>
                <span id="cameraHint">Make sure to make it visible</span>
              </div>
              <div class="camera-frame">
                <div class="camera-viewfinder" aria-hidden="true">
                  <span class="camera-corner camera-corner-tl"></span>
                  <span class="camera-corner camera-corner-tr"></span>
                  <span class="camera-corner camera-corner-bl"></span>
                  <span class="camera-corner camera-corner-br"></span>
                </div>
                <video id="cameraVideo" autoplay playsinline muted></video>
                <img id="cameraStillImage" class="hidden" alt="Captured camera preview" />
                <canvas id="cameraCanvas" class="hidden"></canvas>
              </div>
              <div class="camera-control-row">
                <button id="capturePhotoButton" class="camera-shutter-button" type="button" aria-label="Capture photo"></button>
                <div id="cameraFallbackActions" class="camera-fallback-actions hidden">
                  <button id="cameraFallbackTakePhoto" class="upload-action-button primary" type="button">Take photo</button>
                  <button id="cameraFallbackChooseGallery" class="upload-action-button" type="button">Choose from gallery</button>
                </div>
                <button id="retakePhotoButton" class="upload-action-button hidden" type="button">Retake</button>
                <button id="confirmPhotoButton" class="upload-action-button primary hidden" type="button">Use Photo</button>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js?v=20260818-semantic-flatlay-collage"></script>
  </body>
</html>
